name: IVME Adversarial Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "ivme_validation/**"
      - ".github/workflows/ivme-adversarial-validation.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests scipy matplotlib tabulate

      - name: Decode validation runner
        run: |
          cat ivme_validation/payload_* | base64 --decode | gzip --decompress > /tmp/run_ivme_validation.py
          python -m py_compile /tmp/run_ivme_validation.py

      - name: Run adversarial validation
        run: |
          python /tmp/run_ivme_validation.py \
            --output ivme_validation_output \
            --start 2024-07-20T00:00:00Z \
            --end 2026-07-20T00:00:00Z \
            --warmup-days 90

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ivme-adversarial-validation
          path: ivme_validation_output/
          if-no-files-found: error
          retention-days: 7

      - name: Clean up temporary pull request and branch
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Temporary IVME validation completed; artifacts uploaded. Closing and removing the execution branch."
          git push origin --delete "$HEAD_REF" || true
