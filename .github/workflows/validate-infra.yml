name: Validate Infrastructure

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/validate-infra.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Initialize Terraform
        run: |
          python scripts/manage_infra.py init \
            --env staging \
            --region ${{ secrets.AWS_REGION }}
      
      - name: Validate Terraform Configuration
        run: python scripts/manage_infra.py validate --env staging
      
      - name: Generate Terraform Plan (Staging)
        run: |
          python scripts/manage_infra.py plan \
            --env staging \
            --vars-file infra/terraform/environments/staging.tfvars
      
      - name: Generate Terraform Plan (Production)
        run: |
          python scripts/manage_infra.py plan \
            --env production \
            --vars-file infra/terraform/environments/production.tfvars
      
      - name: Comment PR
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('infra/terraform/tfplan', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Terraform Plan Output\n```hcl\n' + planOutput + '\n```'
            });
