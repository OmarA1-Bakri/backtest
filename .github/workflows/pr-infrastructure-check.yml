name: PR Infrastructure Check

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/**'

jobs:
  validate-terraform:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.0.0"
      
      - name: Terraform Init
        run: |
          cd terraform
          terraform init -backend=false
      
      - name: Terraform Format
        run: |
          cd terraform
          terraform fmt -check -recursive
      
      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate
      
      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -input=false -var-file="staging.tfvars"
        env:
          TF_VAR_environment: staging
          TF_VAR_aws_region: us-east-1
          TF_VAR_container_image: dummy-image:latest
          TF_VAR_db_name: backtest
          TF_VAR_db_username: admin
          TF_VAR_db_password: dummy-password
          TF_VAR_certificate_arn: dummy-arn
  
  validate-workflows:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Install actionlint
        run: |
          curl -L https://github.com/rhysd/actionlint/releases/latest/download/actionlint_linux_amd64.tar.gz | tar xz
          sudo mv actionlint /usr/local/bin/
      
      - name: Validate GitHub Actions Workflows
        run: |
          actionlint .github/workflows/blue-green-deploy.yml
          actionlint .github/workflows/staging-deploy.yml
          actionlint .github/workflows/test-infrastructure.yml
          actionlint .github/workflows/pr-infrastructure-check.yml
  
  mock-deployment:
    runs-on: ubuntu-latest
    needs: [validate-terraform, validate-workflows]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Mock Blue/Green Deployment
        run: |
          # Mock AWS CLI commands
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/config
          echo "region = us-east-1" >> ~/.aws/config
          echo "output = json" >> ~/.aws/config
          
          # Create mock AWS CLI
          echo '#!/bin/bash
          case "$1" in
            "ecs")
              echo "{\"services\":[{\"tags\":[{\"key\":\"Environment\",\"value\":\"blue\"}]}]}"
              ;;
            "elbv2")
              echo "{\"TargetGroups\":[{\"TargetGroupArn\":\"arn:mock\"}]}"
              ;;
            *)
              echo "{}"
              ;;
          esac' > mock-aws
          chmod +x mock-aws
          sudo mv mock-aws /usr/local/bin/aws
          
          # Test blue-green deployment workflow
          source .github/workflows/blue-green-deploy.yml
