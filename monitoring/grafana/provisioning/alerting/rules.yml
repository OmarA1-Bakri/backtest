apiVersion: 1

groups:
  - orgId: 1
    name: BacktestAlerts
    folder: Backtest
    interval: 1m
    rules:
      - uid: high_error_rate
        title: High Error Rate Alert
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: |
                sum(rate(http_errors_total[5m])) /
                sum(rate(http_requests_total[5m])) > 0.05
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              hide: false
              queryType: range
              relativeTimeRange:
                from: 300
                to: 0
          - refId: B
            datasourceUid: '__expr__'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              refId: B
              type: classic_conditions
              hide: false
              queryType: expression
        noDataState: NoData
        execErrState: Error
        for: 5m
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: High error rate detected
          description: Error rate is above 5% for the last 5 minutes

      - uid: high_latency
        title: High Latency Alert
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: |
                histogram_quantile(0.95,
                  rate(http_request_duration_seconds_bucket[5m])
                ) > 2
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              hide: false
              queryType: range
              relativeTimeRange:
                from: 300
                to: 0
          - refId: B
            datasourceUid: '__expr__'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              refId: B
              type: classic_conditions
              hide: false
              queryType: expression
        noDataState: NoData
        execErrState: Error
        for: 5m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: High latency detected
          description: 95th percentile latency is above 2 seconds

      - uid: high_cpu_usage
        title: High CPU Usage Alert
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: system_cpu_usage > 80
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              hide: false
              queryType: range
              relativeTimeRange:
                from: 300
                to: 0
          - refId: B
            datasourceUid: '__expr__'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              refId: B
              type: classic_conditions
              hide: false
              queryType: expression
        noDataState: NoData
        execErrState: Error
        for: 5m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: High CPU usage
          description: CPU usage is above 80%

      - uid: high_task_failure
        title: High Task Failure Rate Alert
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: |
                sum(rate(celery_tasks_total{status="failure"}[5m])) /
                sum(rate(celery_tasks_total[5m])) > 0.1
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              hide: false
              queryType: range
              relativeTimeRange:
                from: 300
                to: 0
          - refId: B
            datasourceUid: '__expr__'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              refId: B
              type: classic_conditions
              hide: false
              queryType: expression
        noDataState: NoData
        execErrState: Error
        for: 5m
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: High task failure rate
          description: Celery task failure rate is above 10%

      - uid: queue_backlog
        title: Queue Backlog Alert
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: celery_queue_size > 1000
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              hide: false
              queryType: range
              relativeTimeRange:
                from: 300
                to: 0
          - refId: B
            datasourceUid: '__expr__'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              refId: B
              type: classic_conditions
              hide: false
              queryType: expression
        noDataState: NoData
        execErrState: Error
        for: 10m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: Large task queue backlog
          description: Task queue has more than 1000 pending tasks
