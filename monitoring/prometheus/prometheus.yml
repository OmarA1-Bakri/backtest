global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'backtest'
    static_configs:
      - targets: ['host.docker.internal:8000']  # FastAPI app metrics
    metrics_path: '/metrics'

  - job_name: 'backtest_strategy'
    static_configs:
      - targets: ['host.docker.internal:9091']  # Strategy metrics
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
